<!DOCTYPE html>
<html>
<head>
    <title>Incoterms Sprites</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .card { border: 1px solid #ccc; padding: 10px; text-align: center; }
        img { max-width: 100%; max-height: 150px; }
        .filename { font-weight: bold; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Incoterms Sprites</h1>
    <div class="grid" id="grid"></div>
    <script>
        const grid = document.getElementById('grid');
        for (let i = 0; i <= 58; i++) {
            const num = i.toString().padStart(2, '0');
            const name = `inco_sprite_${num}.png`;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="/images/import-export/incoterms/${name}" alt="${name}"><div class="filename">${name}</div>`;
            grid.appendChild(card);
        }
    </script>
</body>
</html>
