<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: #eee; }
  .wrapper { position: relative; display: inline-block; }
  .grid-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .hline { position: absolute; width: 100%; height: 1px; background: rgba(255,0,0,0.5); }
  .vline { position: absolute; height: 100%; width: 1px; background: rgba(255,0,0,0.5); }
  .label { position: absolute; font-size: 10px; color: red; background: white; padding: 1px; }
</style>
</head>
<body>
<div class="wrapper">
  <img src="incoterm-section.png" id="img" style="display:block;">
  <div class="grid-lines" id="grid"></div>
</div>
<script>
  window.onload = function() {
    let img = document.getElementById('img');
    let grid = document.getElementById('grid');
    let w = img.width;
    let h = img.height;
    for (let y = 0; y <= h; y += 100) {
      let line = document.createElement('div');
      line.className = 'hline'; line.style.top = y + 'px';
      grid.appendChild(line);
      let label = document.createElement('div');
      label.className = 'label'; label.style.top = y + 'px'; label.style.left = '0';
      label.innerText = y; grid.appendChild(label);
    }
    for (let x = 0; x <= w; x += 100) {
      let line = document.createElement('div');
      line.className = 'vline'; line.style.left = x + 'px';
      grid.appendChild(line);
      let label = document.createElement('div');
      label.className = 'label'; label.style.left = x + 'px'; label.style.top = '0';
      label.innerText = x; grid.appendChild(label);
    }
  }
</script>
</body>
</html>
